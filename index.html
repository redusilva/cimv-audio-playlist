<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml"
        href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='0.9em' font-size='90'>🎧</text></svg>">
    <title>Minha Playlist</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background: #fafafa;
            font-family: 'Inter', sans-serif;
            color: #333;
        }

        .track-item.active {
            background-color: #f97316;
            color: white;
        }

        .track-item:hover {
            background-color: #f3f4f6;
        }

        input[type="range"] {
            width: 100%;
            height: 6px;
            border-radius: 4px;
            background: linear-gradient(to right, #f97316 0%, #f97316 var(--progress, 0%), #ddd var(--progress, 0%), #ddd 100%);
            outline: none;
            appearance: none;
        }

        input[type="range"]::-webkit-slider-thumb {
            appearance: none;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: #f97316;
            cursor: pointer;
        }

        input[type="range"]::-moz-range-thumb {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: #f97316;
            cursor: pointer;
            border: none;
        }

        /* Indicador visual para botão ativo */
        .btn-active {
            color: white !important;
            background-color: #f97316 !important;
            box-shadow: 0 0 10px #f97316a0;
        }

        #currentTitle {
            max-width: 200px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        @media (min-width: 640px) {
            #currentTitle {
                max-width: 300px;
            }
        }
    </style>
</head>

<body class="flex flex-col items-center p-6 min-h-screen pb-[160px]">

    <div class="text-center mb-6">
        <h1 class="text-2xl font-semibold text-orange-500">🎵 Minha Biblioteca</h1>
        <p class="text-sm text-gray-600 mt-2">
            Duração total: <span id="totalPlaylistTime" class="font-semibold">--:--</span><br>
            Tempo restante: <span id="remainingPlaylistTime" class="font-semibold">--:--</span>
        </p>
    </div>

    <!-- Lista -->
    <div id="playlist" class="w-full md:w-2/3 bg-white rounded-2xl shadow-md divide-y divide-gray-100 mb-5"></div>

    <!-- Player fixo -->
    <div class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 shadow-lg p-4">
        <div class="flex flex-col gap-3 md:grid md:grid-cols-3 md:items-center">

            <!-- Faixa atual -->
            <div class="flex flex-col items-center md:items-start text-center md:text-left min-w-0">
                <span id="currentTitle" class="font-semibold text-gray-800"></span>
                <small id="status" class="text-gray-500">Pausado</small>
            </div>

            <!-- Controles (centralizado) -->
            <div class="flex justify-center items-center space-x-3">
                <button id="prevBtn" class="text-gray-600 hover:text-orange-500 text-2xl">⏮️</button>
                <button id="playPauseBtn"
                    class="text-gray-700 bg-orange-500 hover:bg-orange-600 text-white px-4 py-2 rounded-full font-semibold">▶️</button>
                <button id="nextBtn" class="text-gray-600 hover:text-orange-500 text-2xl">⏭️</button>
            </div>

            <!-- Espaço vazio para manter layout -->
            <div class="hidden md:block"></div>
        </div>

        <!-- Barra de progresso -->
        <div class="mt-3">
            <div class="flex justify-between text-xs text-gray-500 mb-1">
                <span id="currentTime">0:00</span>
                <span id="totalTime">0:00</span>
            </div>
            <input id="progressBar" type="range" min="0" max="100" value="0">
        </div>
    </div>

    <audio id="audioPlayer" class="hidden"></audio>

    <script>
        const textos = [
            { titulo: "The Bell of Atri", arquivo: "audios/the_bell_of_atri_peter_complete_audio.mp3" },
            { titulo: "Goldilocks and the Three Bears", arquivo: "audios/goldilocks_and_the_three_bears_peter_audio_completo.mp3" },
            { titulo: "Antonio Canova", arquivo: "audios/Antonio Canova Peter Complete Audio.mp3" },
            { titulo: "Why Cats and Dogs are Enemies", arquivo: "audios/why_cats_and_dogs_are_enemies_peter_complete_audio.mp3" },
            { titulo: "Lost and Found", arquivo: "audios/Lost and Found Peter Complete Audio.mp3" },
            { titulo: "Steve Jobs Commencement Address 001", arquivo: "audios/AUDIO_Steve_Jobs_Commencement_Address_01.mp3" },
        ];

        const playlistEl = document.getElementById("playlist");
        const audio = document.getElementById("audioPlayer");
        const playPauseBtn = document.getElementById("playPauseBtn");
        const prevBtn = document.getElementById("prevBtn");
        const nextBtn = document.getElementById("nextBtn");
        const repeatBtn = document.getElementById("repeatBtn");
        const playAllBtn = document.getElementById("playAllBtn");
        const currentTitle = document.getElementById("currentTitle");
        const statusEl = document.getElementById("status");
        const searchInput = document.getElementById("searchInput");
        const progressBar = document.getElementById("progressBar");
        const currentTimeEl = document.getElementById("currentTime");
        const totalTimeEl = document.getElementById("totalTime");

        let currentIndex = 0;
        let durations = {};
        let totalPlaylistDuration = 0;
        let playedDuration = 0;
        let wakeLock = null;

        function formatTime(sec) {
            if (isNaN(sec)) return "0:00";
            const m = Math.floor(sec / 60);
            const s = Math.floor(sec % 60);
            return `${m}:${s.toString().padStart(2, "0")}`;
        }

        function formatDuration(totalSeconds) {
            const hours = Math.floor(totalSeconds / 3600);
            const minutes = Math.floor((totalSeconds % 3600) / 60);
            const seconds = Math.floor(totalSeconds % 60);

            if (hours > 0) {
                return `${hours}h ${minutes}min`;
            } else if (minutes > 0) {
                return `${minutes}min ${seconds}s`;
            } else {
                return `${seconds}s`;
            }
        }

        function updateTotalPlaylistTime() {
            totalPlaylistDuration = Object.values(durations).reduce((sum, dur) => sum + dur, 0);
            document.getElementById("totalPlaylistTime").textContent = formatDuration(totalPlaylistDuration);
            updateRemainingTime();
        }

        function updateRemainingTime() {
            playedDuration = 0;
            for (let i = 0; i < currentIndex; i++) {
                playedDuration += durations[i] || 0;
            }
            playedDuration += audio.currentTime || 0;

            const remaining = Math.max(0, totalPlaylistDuration - playedDuration);
            document.getElementById("remainingPlaylistTime").textContent = formatDuration(remaining);
        }

        // Wake Lock API para manter a tela ativa
        async function requestWakeLock() {
            try {
                if ('wakeLock' in navigator) {
                    wakeLock = await navigator.wakeLock.request('screen');
                    console.log('Wake Lock ativado - tela permanecerá ativa');

                    wakeLock.addEventListener('release', () => {
                        console.log('Wake Lock liberado');
                    });
                }
            } catch (err) {
                console.error('Erro ao solicitar Wake Lock:', err);
            }
        }

        async function releaseWakeLock() {
            if (wakeLock !== null) {
                try {
                    await wakeLock.release();
                    wakeLock = null;
                } catch (err) {
                    console.error('Erro ao liberar Wake Lock:', err);
                }
            }
        }

        // Reativar wake lock quando o usuário retorna à página
        document.addEventListener('visibilitychange', async () => {
            if (document.visibilityState === 'visible' && !audio.paused) {
                await requestWakeLock();
            }
        });

        function renderPlaylist() {
            playlistEl.innerHTML = "";
            textos.forEach((t, i) => {
                const div = document.createElement("div");
                div.className = "track-item flex justify-between items-center p-4 cursor-pointer transition";
                div.innerHTML = `
            <span>${t.titulo}</span>
            <small class="text-gray-400" id="dur-${i}">--:--</small>
          `;
                div.onclick = () => playTrack(i);
                playlistEl.appendChild(div);

                const tempAudio = new Audio(t.arquivo);
                tempAudio.addEventListener("loadedmetadata", () => {
                    durations[i] = tempAudio.duration;
                    document.getElementById(`dur-${i}`).textContent = formatTime(tempAudio.duration);
                    updateTotalPlaylistTime();
                });
            });
            updateActiveTrack();
        }

        function updateActiveTrack() {
            document.querySelectorAll(".track-item").forEach((el, i) => {
                el.classList.toggle("active", i === currentIndex);
            });
            currentTitle.textContent = textos[currentIndex].titulo;
        }

        function playTrack(index) {
            currentIndex = index;
            audio.src = textos[index].arquivo;
            audio.play();
            statusEl.textContent = "Tocando";
            playPauseBtn.textContent = "⏸️";
            updateActiveTrack();
            updateRemainingTime();
            updateMediaSession();
            requestWakeLock(); // Manter tela ativa
        }

        // Media Session API para controles nativos e reprodução em segundo plano
        function updateMediaSession() {
            if ('mediaSession' in navigator) {
                navigator.mediaSession.metadata = new MediaMetadata({
                    title: textos[currentIndex].titulo,
                    artist: 'Minha Biblioteca',
                    album: 'Playlist',
                    artwork: [
                        { src: 'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><text y="0.9em" font-size="90">🎧</text></svg>', sizes: '96x96', type: 'image/svg+xml' }
                    ]
                });

                // Configurar handlers para os controles nativos
                navigator.mediaSession.setActionHandler('play', () => {
                    audio.play();
                    statusEl.textContent = "Tocando";
                    playPauseBtn.textContent = "⏸️";
                    requestWakeLock(); // Manter tela ativa
                });

                navigator.mediaSession.setActionHandler('pause', () => {
                    audio.pause();
                    statusEl.textContent = "Pausado";
                    playPauseBtn.textContent = "▶️";
                    releaseWakeLock(); // Permitir que a tela desligue
                });

                navigator.mediaSession.setActionHandler('previoustrack', () => {
                    currentIndex = (currentIndex - 1 + textos.length) % textos.length;
                    playTrack(currentIndex);
                });

                navigator.mediaSession.setActionHandler('nexttrack', () => {
                    if (currentIndex < textos.length - 1) {
                        playTrack(currentIndex + 1);
                    } else {
                        currentIndex = 0;
                        playTrack(currentIndex);
                    }
                });

                // Atualizar posição da reprodução
                navigator.mediaSession.setPositionState({
                    duration: audio.duration || 0,
                    playbackRate: audio.playbackRate,
                    position: audio.currentTime || 0
                });
            }
        }

        playPauseBtn.onclick = () => {
            if (!audio.src) playTrack(currentIndex);
            else if (audio.paused) {
                audio.play();
                statusEl.textContent = "Tocando";
                playPauseBtn.textContent = "⏸️";
                requestWakeLock(); // Manter tela ativa
            } else {
                audio.pause();
                statusEl.textContent = "Pausado";
                playPauseBtn.textContent = "▶️";
                releaseWakeLock(); // Permitir que a tela desligue
            }
        };

        prevBtn.onclick = () => {
            currentIndex = (currentIndex - 1 + textos.length) % textos.length;
            playTrack(currentIndex);
        };

        nextBtn.onclick = () => {
            if (currentIndex < textos.length - 1) {
                playTrack(currentIndex + 1);
            } else {
                currentIndex = 0;
                playTrack(currentIndex);
            }
        };

        audio.addEventListener("timeupdate", () => {
            const progress = (audio.currentTime / audio.duration) * 100;
            progressBar.value = progress || 0;
            progressBar.style.setProperty('--progress', `${progress}%`);
            currentTimeEl.textContent = formatTime(audio.currentTime);
            totalTimeEl.textContent = formatTime(audio.duration);
            updateRemainingTime();

            // Atualizar posição na Media Session API
            if ('mediaSession' in navigator && audio.duration) {
                try {
                    navigator.mediaSession.setPositionState({
                        duration: audio.duration,
                        playbackRate: audio.playbackRate,
                        position: audio.currentTime
                    });
                } catch (e) {
                    // Ignorar erros se a API não estiver disponível
                }
            }
        });

        progressBar.addEventListener("input", e => {
            const newTime = (e.target.value / 100) * audio.duration;
            audio.currentTime = newTime;
        });

        audio.addEventListener("ended", () => {
            if (currentIndex < textos.length - 1) {
                playTrack(currentIndex + 1);
            } else {
                playPauseBtn.textContent = "▶️";
                statusEl.textContent = "Pausado";
                releaseWakeLock(); // Permitir que a tela desligue quando terminar
            }
        });

        // Atualizar Media Session quando os metadados do áudio carregarem
        audio.addEventListener("loadedmetadata", () => {
            if ('mediaSession' in navigator && audio.duration) {
                try {
                    navigator.mediaSession.setPositionState({
                        duration: audio.duration,
                        playbackRate: audio.playbackRate,
                        position: audio.currentTime || 0
                    });
                } catch (e) {
                    // Ignorar erros
                }
            }
        });

        renderPlaylist();
    </script>
</body>

</html>
