<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml"
        href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='0.9em' font-size='90'>🎧</text></svg>">
    <title>Minha Playlist</title>
    <script>
        if (localStorage.getItem('theme') !== 'light') {
            document.documentElement.classList.add('dark');
        }
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --bg-page: #fafafa;
            --bg-surface: #ffffff;
            --bg-surface-elevated: #ffffff;
            --bg-hover: #f3f4f6;
            --text-primary: #333333;
            --text-secondary: #4b5563;
            --text-muted: #6b7280;
            --text-track-dur: #9ca3af;
            --border-color: #e5e7eb;
            --border-input: #d1d5db;
            --divide-color: #f3f4f6;
            --progress-track: #dddddd;
            --cancel-btn-bg: #d1d5db;
            --cancel-btn-hover: #9ca3af;
            --cancel-btn-text: #374151;
            --repeat-indicator-bg: #f3e8ff;
            --repeat-indicator-text: #7e22ce;
        }

        html.dark {
            --bg-page: #1c1c1c;
            --bg-surface: #252525;
            --bg-surface-elevated: #2e2e2e;
            --bg-hover: #323232;
            --text-primary: #e8e8e8;
            --text-secondary: #a0a0a0;
            --text-muted: #a0a0a0;
            --text-track-dur: #6b6b6b;
            --border-color: #3a3a3a;
            --border-input: #3a3a3a;
            --divide-color: #3a3a3a;
            --progress-track: #3a3a3a;
            --cancel-btn-bg: #3a3a3a;
            --cancel-btn-hover: #4a4a4a;
            --cancel-btn-text: #e8e8e8;
            --repeat-indicator-bg: #2e1f3e;
            --repeat-indicator-text: #c084fc;
        }

        html {
            background: var(--bg-page);
        }

        body {
            background: var(--bg-page);
            font-family: 'Inter', sans-serif;
            color: var(--text-primary);
        }

        .track-item.active {
            background-color: #f97316;
            color: white;
        }

        .track-item.active small {
            color: white;
        }

        .track-item:hover:not(.active) {
            background-color: var(--bg-hover);
        }

        input[type="range"] {
            width: 100%;
            height: 6px;
            border-radius: 4px;
            background: linear-gradient(to right, #f97316 0%, #f97316 var(--progress, 0%), var(--progress-track) var(--progress, 0%), var(--progress-track) 100%);
            outline: none;
            appearance: none;
        }

        input[type="range"]::-webkit-slider-thumb {
            appearance: none;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: #f97316;
            cursor: pointer;
        }

        input[type="range"]::-moz-range-thumb {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: #f97316;
            cursor: pointer;
            border: none;
        }

        /* Indicador visual para botão ativo */
        .btn-active {
            color: white !important;
            background-color: #f97316 !important;
            box-shadow: 0 0 10px #f97316a0;
        }

        #currentTitle {
            max-width: 200px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        @media (min-width: 640px) {
            #currentTitle {
                max-width: 300px;
            }
        }

        /* ---- DARK MODE OVERRIDES ---- */

        html.dark #playlist {
            background-color: var(--bg-surface);
            border-color: var(--border-color);
        }

        html.dark #playlist .track-item {
            border-color: var(--divide-color);
        }

        html.dark #player-bar {
            background-color: var(--bg-surface);
            border-color: var(--border-color);
        }

        html.dark #currentTitle {
            color: var(--text-primary);
        }

        html.dark #status {
            color: var(--text-muted);
        }

        html.dark #prevBtn,
        html.dark #nextBtn {
            color: var(--text-secondary);
        }

        html.dark .progress-times {
            color: var(--text-muted);
        }

        html.dark #repeatModeIndicator {
            background-color: var(--repeat-indicator-bg);
            border-color: #7e22ce;
        }

        html.dark #repeatModeIndicator span {
            color: var(--repeat-indicator-text);
        }

        html.dark #repeatModal>div {
            background-color: var(--bg-surface-elevated);
        }

        html.dark #repeatModal p,
        html.dark #repeatModal label,
        html.dark #repeatModal h2 {
            color: var(--text-secondary);
        }

        html.dark #repeatAudioSelect,
        html.dark #repeatCount {
            background-color: var(--bg-surface);
            border-color: var(--border-input);
            color: var(--text-primary);
        }

        html.dark #cancelRepeatBtn {
            background-color: var(--cancel-btn-bg);
            color: var(--cancel-btn-text);
        }

        html.dark #cancelRepeatBtn:hover {
            background-color: var(--cancel-btn-hover);
        }

        html.dark .track-item small {
            color: var(--text-track-dur);
        }

        html.dark .stats-text {
            color: var(--text-secondary);
        }

        html.dark #themeToggleBtn:hover {
            background-color: var(--bg-hover);
        }
    </style>
</head>

<body class="flex flex-col items-center p-6 min-h-screen pb-[160px]">

    <div class="text-center mb-6">
        <h1 class="text-2xl font-semibold text-orange-500">🎵 Minha Biblioteca</h1>
        <button id="themeToggleBtn" aria-label="Alternar modo claro/escuro"
            class="fixed top-4 right-4 z-10 p-2 rounded-full text-xl transition hover:bg-gray-100"
            title="Alternar tema">☀️</button>
        <p class="text-sm text-gray-600 mt-2 stats-text">
            Duração total: <span id="totalPlaylistTime" class="font-semibold">--:--</span><br>
            Tempo restante: <span id="remainingPlaylistTime" class="font-semibold">--:--</span>
        </p>
        <button id="repeatModeBtn"
            class="mt-3 px-4 py-2 bg-purple-500 hover:bg-purple-600 text-white rounded-lg font-semibold transition">
            🔁 Modo Repetição
        </button>
        <div id="repeatModeIndicator"
            class="hidden mt-2 px-4 py-2 bg-purple-100 border-2 border-purple-500 rounded-lg inline-block">
            <span class="text-purple-700 font-semibold">🔄 Modo Repetição Ativo</span>
            <button id="exitRepeatModeBtn"
                class="ml-3 px-3 py-1 bg-red-500 hover:bg-red-600 text-white rounded text-sm">
                ❌ Sair
            </button>
        </div>
    </div>

    <!-- Lista -->
    <div id="playlist" class="w-full md:w-2/3 bg-white rounded-2xl shadow-md divide-y divide-gray-100 mb-5"></div>

    <!-- Player fixo -->
    <div id="player-bar" class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 shadow-lg p-4">
        <div class="flex flex-col gap-3 md:grid md:grid-cols-3 md:items-center">

            <!-- Faixa atual -->
            <div class="flex flex-col items-center md:items-start text-center md:text-left min-w-0">
                <span id="currentTitle" class="font-semibold text-gray-800"></span>
                <small id="status" class="text-gray-500">Pausado</small>
            </div>

            <!-- Controles (centralizado) -->
            <div class="flex justify-center items-center space-x-3">
                <button id="prevBtn" class="text-gray-600 hover:text-orange-500 text-2xl">⏮️</button>
                <button id="playPauseBtn"
                    class="text-gray-700 bg-orange-500 hover:bg-orange-600 text-white px-4 py-2 rounded-full font-semibold">▶️</button>
                <button id="nextBtn" class="text-gray-600 hover:text-orange-500 text-2xl">⏭️</button>
            </div>

            <!-- Espaço vazio para manter layout -->
            <div class="hidden md:block"></div>
        </div>

        <!-- Barra de progresso -->
        <div class="mt-3">
            <div class="flex justify-between text-xs text-gray-500 mb-1 progress-times">
                <span id="currentTime">0:00</span>
                <span id="totalTime">0:00</span>
            </div>
            <input id="progressBar" type="range" min="0" max="100" value="0">
        </div>
    </div>

    <audio id="audioPlayer" class="hidden"></audio>

    <!-- Modal de Modo Repetição -->
    <div id="repeatModal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 p-4">
        <div class="bg-white rounded-2xl shadow-2xl p-6 max-w-md w-full">
            <h2 class="text-2xl font-bold text-purple-600 mb-4">🔁 Modo Repetição</h2>
            <p class="text-gray-600 mb-4">Selecione um áudio e defina quantas vezes quer repeti-lo:</p>

            <label class="block mb-2 text-sm font-semibold text-gray-700">Áudio:</label>
            <select id="repeatAudioSelect" class="w-full p-2 border border-gray-300 rounded-lg mb-4">
            </select>

            <label class="block mb-2 text-sm font-semibold text-gray-700">Repetições:</label>
            <input type="number" id="repeatCount" min="1" value="10"
                class="w-full p-2 border border-gray-300 rounded-lg mb-6">

            <div class="flex gap-3">
                <button id="confirmRepeatBtn"
                    class="flex-1 px-4 py-2 bg-purple-500 hover:bg-purple-600 text-white rounded-lg font-semibold">
                    ✅ Confirmar
                </button>
                <button id="cancelRepeatBtn"
                    class="flex-1 px-4 py-2 bg-gray-300 hover:bg-gray-400 text-gray-700 rounded-lg font-semibold">
                    ❌ Cancelar
                </button>
            </div>
        </div>
    </div>

    <script>
        function toggleTheme() {
            const isDark = document.documentElement.classList.toggle('dark');
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
            document.getElementById('themeToggleBtn').textContent = isDark ? '☀️' : '🌙';
        }
        document.getElementById('themeToggleBtn').addEventListener('click', toggleTheme);
        document.getElementById('themeToggleBtn').textContent =
            document.documentElement.classList.contains('dark') ? '☀️' : '🌙';

        const textos = [
            { titulo: "Goldilocks and the Three Bears", arquivo: "audios/goldilocks_and_the_three_bears_peter_audio_completo.mp3" },
            { titulo: "Antonio Canova", arquivo: "audios/Antonio Canova Peter Complete Audio.mp3" },
            { titulo: "Why Cats and Dogs are Enemies", arquivo: "audios/why_cats_and_dogs_are_enemies_peter_complete_audio.mp3" },
            { titulo: "Lost and Found", arquivo: "audios/Lost and Found Peter Complete Audio.mp3" },
            { titulo: "Steve Jobs Commencement Address 001", arquivo: "audios/AUDIO_Steve_Jobs_Commencement_Address_01.mp3" },
            { titulo: "Steve Jobs Commencement Address 002", arquivo: "audios/AUDIO_Steve_Jobs_Commencement_Address_02.mp3" },
            { titulo: "Steve Jobs Commencement Address 003", arquivo: "audios/AUDIO_Steve_Jobs_Commencement_Address_03.mp3" },
            { titulo: "Steve Jobs Commencement Address 004", arquivo: "audios/AUDIO Steve Jobs Commencement Address 04.mp3" },
            { titulo: "Steve Jobs Commencement Address 005", arquivo: "audios/AUDIO Steve Jobs Commencement Address 05.mp3" },
            { titulo: "Steve Jobs Commencement Address 006", arquivo: "audios/AUDIO Steve Jobs Commencement Address 06.mp3" },
        ];

        const playlistEl = document.getElementById("playlist");
        const audio = document.getElementById("audioPlayer");
        const playPauseBtn = document.getElementById("playPauseBtn");
        const prevBtn = document.getElementById("prevBtn");
        const nextBtn = document.getElementById("nextBtn");
        const repeatBtn = document.getElementById("repeatBtn");
        const playAllBtn = document.getElementById("playAllBtn");
        const currentTitle = document.getElementById("currentTitle");
        const statusEl = document.getElementById("status");
        const searchInput = document.getElementById("searchInput");
        const progressBar = document.getElementById("progressBar");
        const currentTimeEl = document.getElementById("currentTime");
        const totalTimeEl = document.getElementById("totalTime");

        let currentIndex = 0;
        let durations = {};
        let totalPlaylistDuration = 0;
        let playedDuration = 0;
        let wakeLock = null;
        let isRepeatMode = false;
        let originalPlaylist = [];
        let repeatModePlaylist = [];

        function formatTime(sec) {
            if (isNaN(sec)) return "0:00";
            const m = Math.floor(sec / 60);
            const s = Math.floor(sec % 60);
            return `${m}:${s.toString().padStart(2, "0")}`;
        }

        function formatDuration(totalSeconds) {
            const hours = Math.floor(totalSeconds / 3600);
            const minutes = Math.floor((totalSeconds % 3600) / 60);
            const seconds = Math.floor(totalSeconds % 60);

            if (hours > 0) {
                return `${hours}h ${minutes}min`;
            } else if (minutes > 0) {
                return `${minutes}min ${seconds}s`;
            } else {
                return `${seconds}s`;
            }
        }

        function updateTotalPlaylistTime() {
            totalPlaylistDuration = Object.values(durations).reduce((sum, dur) => sum + dur, 0);
            document.getElementById("totalPlaylistTime").textContent = formatDuration(totalPlaylistDuration);
            updateRemainingTime();
        }

        function updateRemainingTime() {
            playedDuration = 0;
            for (let i = 0; i < currentIndex; i++) {
                playedDuration += durations[i] || 0;
            }
            playedDuration += audio.currentTime || 0;

            const remaining = Math.max(0, totalPlaylistDuration - playedDuration);
            document.getElementById("remainingPlaylistTime").textContent = formatDuration(remaining);
        }

        // Wake Lock API para manter a tela ativa
        async function requestWakeLock() {
            try {
                if ('wakeLock' in navigator) {
                    wakeLock = await navigator.wakeLock.request('screen');
                    console.log('Wake Lock ativado - tela permanecerá ativa');

                    wakeLock.addEventListener('release', () => {
                        console.log('Wake Lock liberado');
                    });
                }
            } catch (err) {
                console.error('Erro ao solicitar Wake Lock:', err);
            }
        }

        async function releaseWakeLock() {
            if (wakeLock !== null) {
                try {
                    await wakeLock.release();
                    wakeLock = null;
                } catch (err) {
                    console.error('Erro ao liberar Wake Lock:', err);
                }
            }
        }

        // Reativar wake lock quando o usuário retorna à página
        document.addEventListener('visibilitychange', async () => {
            if (document.visibilityState === 'visible' && !audio.paused) {
                await requestWakeLock();
            }
        });

        function renderPlaylist() {
            playlistEl.innerHTML = "";
            const currentPlaylist = isRepeatMode ? repeatModePlaylist : textos;

            currentPlaylist.forEach((t, i) => {
                const div = document.createElement("div");
                div.className = "track-item flex justify-between items-center p-4 cursor-pointer transition";
                div.innerHTML = `
            <span>${t.titulo}</span>
            <small class="text-gray-400" id="dur-${i}">--:--</small>
          `;
                div.onclick = () => playTrack(i);
                playlistEl.appendChild(div);

                const tempAudio = new Audio(t.arquivo);
                tempAudio.addEventListener("loadedmetadata", () => {
                    durations[i] = tempAudio.duration;
                    document.getElementById(`dur-${i}`).textContent = formatTime(tempAudio.duration);
                    updateTotalPlaylistTime();
                });
            });
            updateActiveTrack();
        }

        // Funções do Modo de Repetição
        function openRepeatModal() {
            const modal = document.getElementById("repeatModal");
            const select = document.getElementById("repeatAudioSelect");

            // Preencher o select com os áudios originais
            select.innerHTML = "";
            textos.forEach((t, i) => {
                const option = document.createElement("option");
                option.value = i;
                option.textContent = t.titulo;
                select.appendChild(option);
            });

            modal.classList.remove("hidden");
        }

        function closeRepeatModal() {
            document.getElementById("repeatModal").classList.add("hidden");
        }

        function activateRepeatMode(audioIndex, repeatCount) {
            isRepeatMode = true;
            originalPlaylist = [...textos];

            // Criar playlist com o áudio repetido
            const selectedAudio = textos[audioIndex];
            repeatModePlaylist = [];
            for (let i = 0; i < repeatCount; i++) {
                repeatModePlaylist.push({
                    titulo: `${selectedAudio.titulo} (${i + 1}/${repeatCount})`,
                    arquivo: selectedAudio.arquivo
                });
            }

            // Atualizar interface
            document.getElementById("repeatModeBtn").classList.add("hidden");
            document.getElementById("repeatModeIndicator").classList.remove("hidden");

            // Resetar e renderizar nova playlist
            currentIndex = 0;
            durations = {};
            renderPlaylist();

            // Opcional: começar a tocar automaticamente
            if (repeatModePlaylist.length > 0) {
                playTrack(0);
            }
        }

        function exitRepeatMode() {
            isRepeatMode = false;
            repeatModePlaylist = [];

            // Atualizar interface
            document.getElementById("repeatModeBtn").classList.remove("hidden");
            document.getElementById("repeatModeIndicator").classList.add("hidden");

            // Resetar e renderizar playlist original
            currentIndex = 0;
            durations = {};
            renderPlaylist();

            // Parar o áudio atual
            audio.pause();
            audio.src = "";
            statusEl.textContent = "Pausado";
            playPauseBtn.textContent = "▶️";
        }

        // Event Listeners do Modo de Repetição
        document.getElementById("repeatModeBtn").onclick = openRepeatModal;
        document.getElementById("exitRepeatModeBtn").onclick = exitRepeatMode;
        document.getElementById("cancelRepeatBtn").onclick = closeRepeatModal;
        document.getElementById("confirmRepeatBtn").onclick = () => {
            const audioIndex = parseInt(document.getElementById("repeatAudioSelect").value);
            const repeatCount = parseInt(document.getElementById("repeatCount").value);

            if (repeatCount > 0) {
                activateRepeatMode(audioIndex, repeatCount);
                closeRepeatModal();
            } else {
                alert("Por favor, insira um número válido de repetições.");
            }
        };

        function updateActiveTrack() {
            const currentPlaylist = isRepeatMode ? repeatModePlaylist : textos;
            document.querySelectorAll(".track-item").forEach((el, i) => {
                el.classList.toggle("active", i === currentIndex);
            });
            currentTitle.textContent = currentPlaylist[currentIndex].titulo;
        }

        function playTrack(index) {
            const currentPlaylist = isRepeatMode ? repeatModePlaylist : textos;
            currentIndex = index;
            audio.src = currentPlaylist[index].arquivo;
            audio.play();
            statusEl.textContent = "Tocando";
            playPauseBtn.textContent = "⏸️";
            updateActiveTrack();
            updateRemainingTime();
            updateMediaSession();
            requestWakeLock(); // Manter tela ativa
        }

        // Media Session API para controles nativos e reprodução em segundo plano
        function updateMediaSession() {
            const currentPlaylist = isRepeatMode ? repeatModePlaylist : textos;
            if ('mediaSession' in navigator) {
                navigator.mediaSession.metadata = new MediaMetadata({
                    title: currentPlaylist[currentIndex].titulo,
                    artist: 'Minha Biblioteca',
                    album: 'Playlist',
                    artwork: [
                        { src: 'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><text y="0.9em" font-size="90">🎧</text></svg>', sizes: '96x96', type: 'image/svg+xml' }
                    ]
                });

                // Configurar handlers para os controles nativos
                navigator.mediaSession.setActionHandler('play', () => {
                    audio.play();
                    statusEl.textContent = "Tocando";
                    playPauseBtn.textContent = "⏸️";
                    requestWakeLock(); // Manter tela ativa
                });

                navigator.mediaSession.setActionHandler('pause', () => {
                    audio.pause();
                    statusEl.textContent = "Pausado";
                    playPauseBtn.textContent = "▶️";
                    releaseWakeLock(); // Permitir que a tela desligue
                });

                navigator.mediaSession.setActionHandler('previoustrack', () => {
                    currentIndex = (currentIndex - 1 + currentPlaylist.length) % currentPlaylist.length;
                    playTrack(currentIndex);
                });

                navigator.mediaSession.setActionHandler('nexttrack', () => {
                    if (currentIndex < currentPlaylist.length - 1) {
                        playTrack(currentIndex + 1);
                    } else {
                        currentIndex = 0;
                        playTrack(currentIndex);
                    }
                });

                // Atualizar posição da reprodução
                navigator.mediaSession.setPositionState({
                    duration: audio.duration || 0,
                    playbackRate: audio.playbackRate,
                    position: audio.currentTime || 0
                });
            }
        }

        playPauseBtn.onclick = () => {
            if (!audio.src) playTrack(currentIndex);
            else if (audio.paused) {
                audio.play();
                statusEl.textContent = "Tocando";
                playPauseBtn.textContent = "⏸️";
                requestWakeLock(); // Manter tela ativa
            } else {
                audio.pause();
                statusEl.textContent = "Pausado";
                playPauseBtn.textContent = "▶️";
                releaseWakeLock(); // Permitir que a tela desligue
            }
        };

        prevBtn.onclick = () => {
            const currentPlaylist = isRepeatMode ? repeatModePlaylist : textos;
            currentIndex = (currentIndex - 1 + currentPlaylist.length) % currentPlaylist.length;
            playTrack(currentIndex);
        };

        nextBtn.onclick = () => {
            const currentPlaylist = isRepeatMode ? repeatModePlaylist : textos;
            if (currentIndex < currentPlaylist.length - 1) {
                playTrack(currentIndex + 1);
            } else {
                currentIndex = 0;
                playTrack(currentIndex);
            }
        };

        audio.addEventListener("timeupdate", () => {
            const progress = (audio.currentTime / audio.duration) * 100;
            progressBar.value = progress || 0;
            progressBar.style.setProperty('--progress', `${progress}%`);
            currentTimeEl.textContent = formatTime(audio.currentTime);
            totalTimeEl.textContent = formatTime(audio.duration);
            updateRemainingTime();

            // Atualizar posição na Media Session API
            if ('mediaSession' in navigator && audio.duration) {
                try {
                    navigator.mediaSession.setPositionState({
                        duration: audio.duration,
                        playbackRate: audio.playbackRate,
                        position: audio.currentTime
                    });
                } catch (e) {
                    // Ignorar erros se a API não estiver disponível
                }
            }
        });

        progressBar.addEventListener("input", e => {
            const newTime = (e.target.value / 100) * audio.duration;
            audio.currentTime = newTime;
        });

        audio.addEventListener("ended", () => {
            const currentPlaylist = isRepeatMode ? repeatModePlaylist : textos;
            if (currentIndex < currentPlaylist.length - 1) {
                playTrack(currentIndex + 1);
            } else {
                playPauseBtn.textContent = "▶️";
                statusEl.textContent = "Pausado";
                releaseWakeLock(); // Permitir que a tela desligue quando terminar
            }
        });

        // Atualizar Media Session quando os metadados do áudio carregarem
        audio.addEventListener("loadedmetadata", () => {
            if ('mediaSession' in navigator && audio.duration) {
                try {
                    navigator.mediaSession.setPositionState({
                        duration: audio.duration,
                        playbackRate: audio.playbackRate,
                        position: audio.currentTime || 0
                    });
                } catch (e) {
                    // Ignorar erros
                }
            }
        });

        renderPlaylist();
    </script>
</body>

</html>
